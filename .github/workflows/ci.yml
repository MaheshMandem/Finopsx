name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & test payment-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finopsx/backend/payment-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: finopsx/backend/payment-service/pom.xml

      - name: Build and run tests
        run: mvn -B verify
