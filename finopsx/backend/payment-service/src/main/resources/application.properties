spring.application.name=payment-service
server.port=8080

# --- PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finopsx}
spring.datasource.username=${DB_USERNAME:finopsx}
spring.datasource.password=${DB_PASSWORD:finopsx}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Redis cache (payment status lookups) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=10m

# --- Kafka (payment events) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
finopsx.kafka.payments-topic=payment-events

# --- API security (HTTP Basic, override in production) ---
spring.security.user.name=${API_USERNAME:finopsx}
spring.security.user.password=${API_PASSWORD:change-me}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
