# Local infrastructure for FinOpsX: PostgreSQL, Redis and Kafka (KRaft, no ZooKeeper)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finopsx
      POSTGRES_USER: finopsx
      POSTGRES_PASSWORD: finopsx
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finopsx"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
